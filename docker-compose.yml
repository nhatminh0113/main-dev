# Full stack for local development / demo:  docker compose up -d --build
# Then open http://localhost:8080 (API docs: http://localhost:8080/api/docs).
# Configuration comes from .env (copy .env.example).

name: taskapp

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-taskapp}
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/18/docker
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    security_opt: [no-new-privileges:true]
    # Not published on the host: only the backend talks to the database.

  backend:
    build: ./app/backend
    image: taskapp-backend:local
    restart: unless-stopped
    environment:
      # Use a URL-safe password (e.g. `openssl rand -hex 16`): it is embedded in this URL.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-taskapp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-taskapp}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/readyz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  frontend:
    build: ./app/frontend
    image: taskapp-frontend:local
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    # nginx only needs to write its pid/temp files (/tmp) and the config rendered from the
    # template at start-up (/etc/nginx/conf.d, owned by the nginx user, UID 101).
    read_only: true
    tmpfs:
      - /tmp
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0755
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  pgdata:
