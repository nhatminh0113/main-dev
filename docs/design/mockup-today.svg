<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <title>Taskapp – mockup màn hình Hôm nay (desktop, chế độ sáng)</title>
  <defs>
    <style>
      .t { fill: #202020; font-size: 14px; }
      .m { fill: #666666; font-size: 12px; }
      .d { fill: #666666; font-size: 13px; }
      .side { fill: #202020; font-size: 14px; }
      .cnt { fill: #757575; font-size: 12px; text-anchor: end; }
      .hdr { fill: #757575; font-size: 11px; font-weight: 700; letter-spacing: 0.6px; }
      .sec { fill: #202020; font-size: 14px; font-weight: 700; }
      .line { stroke: #ececec; stroke-width: 1; }
      .ic { fill: none; stroke: #666666; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="1280" height="820" fill="#ffffff"/>

  <!-- ================= Sidebar ================= -->
  <rect width="272" height="820" fill="#f8f7f4"/>
  <line x1="272" y1="0" x2="272" y2="820" stroke="#ebe9e4"/>

  <rect x="20" y="24" width="24" height="24" rx="7" fill="#5b5bd6"/>
  <path d="M26 36.5l4 4 8-8.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="54" y="42" font-size="16" font-weight="700" fill="#202020">Taskapp</text>

  <!-- Add task -->
  <circle cx="32" cy="88" r="10" fill="#5b5bd6"/>
  <path d="M32 83v10M27 88h10" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <text x="52" y="93" font-size="14" font-weight="600" fill="#4a4ac4">Thêm công việc</text>

  <!-- Nav -->
  <circle class="ic" cx="31" cy="127" r="6"/><path class="ic" d="M35.5 131.5l4 4"/>
  <text class="side" x="52" y="133">Tìm kiếm</text>
  <text x="248" y="133" font-size="11" fill="#9a9a9a" text-anchor="end">/</text>

  <path class="ic" d="M24 163h6l2 3h4l2-3h6v8H24z M24 163l3-7h12l3 7"/>
  <text class="side" x="52" y="169">Hộp thư đến</text>
  <text class="cnt" x="248" y="169">4</text>

  <rect x="8" y="186" width="256" height="34" rx="6" fill="#ebebfa"/>
  <rect x="24" y="196" width="16" height="15" rx="3" fill="none" stroke="#4a4ac4" stroke-width="1.6"/>
  <text x="32" y="208" font-size="8" font-weight="700" fill="#4a4ac4" text-anchor="middle">16</text>
  <text x="52" y="208" font-size="14" font-weight="600" fill="#4a4ac4">Hôm nay</text>
  <text x="248" y="208" font-size="12" fill="#4a4ac4" text-anchor="end">4</text>

  <rect class="ic" x="24" y="232" width="16" height="15" rx="3"/><path class="ic" d="M24 237h16M29 241h2M34 241h2"/>
  <text class="side" x="52" y="245">Sắp tới</text>
  <text class="cnt" x="248" y="245">8</text>

  <circle class="ic" cx="32" cy="277" r="7.5"/><path class="ic" d="M28.5 277l2.5 2.5 4.5-5"/>
  <text class="side" x="52" y="282">Đã hoàn thành</text>

  <!-- Projects -->
  <text class="hdr" x="24" y="330">DỰ ÁN</text>
  <path d="M244 322v10M239 327h10" stroke="#9a9a9a" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="32" cy="357" r="5" fill="#d1453b"/>
  <text class="side" x="52" y="362">Đồ án DevOps</text><text class="cnt" x="248" y="362">6</text>
  <circle cx="32" cy="393" r="5" fill="#299438"/>
  <text class="side" x="52" y="398">Cá nhân</text><text class="cnt" x="248" y="398">2</text>
  <circle cx="32" cy="429" r="5" fill="#14aaf5"/>
  <text class="side" x="52" y="434">Học tập</text><text class="cnt" x="248" y="434">3</text>

  <!-- Labels -->
  <text class="hdr" x="24" y="482">NHÃN</text>
  <path class="ic" d="M25 504l7-7h7v7l-7 7z" stroke="#eb8909"/><circle cx="35.5" cy="500.5" r="1.2" fill="#eb8909"/>
  <text class="side" x="52" y="510">khẩn</text><text class="cnt" x="248" y="510">2</text>
  <path class="ic" d="M25 540l7-7h7v7l-7 7z" stroke="#af38eb"/><circle cx="35.5" cy="536.5" r="1.2" fill="#af38eb"/>
  <text class="side" x="52" y="546">mua-sắm</text><text class="cnt" x="248" y="546">1</text>

  <text x="24" y="796" font-size="11" fill="#8a8a8a">Phím tắt: <tspan font-weight="700">q</tspan> thêm nhanh · <tspan font-weight="700">/</tspan> tìm kiếm · <tspan font-weight="700">?</tspan> trợ giúp</text>

  <!-- ================= Main ================= -->
  <text x="352" y="74" font-size="24" font-weight="700" fill="#202020">Hôm nay</text>
  <text x="352" y="98" font-size="13" fill="#666666">Thứ Sáu, 16 tháng 10 · 4 việc</text>
  <rect x="1028" y="54" width="84" height="30" rx="6" fill="none" stroke="#e5e5e5"/>
  <path class="ic" d="M1042 64h14M1044 69h10M1046 74h6"/>
  <text x="1064" y="74" font-size="13" fill="#444">Hiển thị</text>

  <!-- Overdue section -->
  <text class="sec" x="352" y="142">Quá hạn</text>
  <text x="1112" y="142" font-size="13" font-weight="600" fill="#4a4ac4" text-anchor="end">Lên lịch lại</text>
  <line class="line" x1="352" y1="154" x2="1112" y2="154"/>

  <circle cx="362" cy="181" r="9" fill="#d1453b" fill-opacity="0.1" stroke="#d1453b" stroke-width="2"/>
  <text class="t" x="382" y="186">Sửa lỗi readiness probe trên staging</text>
  <rect class="ic" x="382" y="197" width="10" height="10" rx="2" stroke="#d1453b"/>
  <text x="397" y="206" font-size="12" fill="#c0392b">14 thg 10</text>
  <text class="m" x="466" y="206">@khẩn</text>
  <text class="m" x="1100" y="206" text-anchor="end">Đồ án DevOps</text>
  <circle cx="1107" cy="202" r="3.5" fill="#d1453b"/>
  <line class="line" x1="382" y1="222" x2="1112" y2="222"/>

  <!-- Today section -->
  <text class="sec" x="352" y="262">16 thg 10 · Hôm nay · Thứ Sáu</text>
  <line class="line" x1="352" y1="274" x2="1112" y2="274"/>

  <circle cx="362" cy="301" r="9" fill="#eb8909" fill-opacity="0.1" stroke="#eb8909" stroke-width="2"/>
  <text class="t" x="382" y="306">Viết Helm chart cho backend</text>
  <text class="d" x="382" y="325">Deployment, Service, Ingress và probe cho 2 môi trường</text>
  <rect class="ic" x="382" y="335" width="10" height="10" rx="2" stroke="#058527"/>
  <text x="397" y="344" font-size="12" fill="#058527">Hôm nay</text>
  <path class="ic" d="M462 336v9M462 340h5M462 345h5" stroke="#777"/>
  <text class="m" x="472" y="344">1/3</text>
  <text class="m" x="1100" y="344" text-anchor="end">Đồ án DevOps</text>
  <circle cx="1107" cy="340" r="3.5" fill="#d1453b"/>
  <line class="line" x1="382" y1="360" x2="1112" y2="360"/>

  <!-- Hover state row -->
  <rect x="344" y="364" width="776" height="62" rx="6" fill="#fafafa"/>
  <circle cx="362" cy="389" r="9" fill="none" stroke="#9a9a9a" stroke-width="1.5"/>
  <path d="M358 389l3 3 5-5.5" fill="none" stroke="#9a9a9a" stroke-width="1.6" stroke-linecap="round"/>
  <text class="t" x="382" y="394">Mua sữa và trứng</text>
  <rect class="ic" x="382" y="404" width="10" height="10" rx="2" stroke="#058527"/>
  <text x="397" y="413" font-size="12" fill="#058527">Hôm nay</text>
  <text class="m" x="462" y="413">@mua-sắm</text>
  <!-- hover actions -->
  <rect class="ic" x="1000" y="381" width="16" height="16" rx="3"/>
  <path class="ic" d="M1004 393l1-4 6-6 3 3-6 6z"/>
  <rect class="ic" x="1030" y="381" width="16" height="16" rx="3"/>
  <path class="ic" d="M1034 386h8M1034 390h8M1034 394h5"/>
  <circle cx="1065" cy="389" r="1.4" fill="#666"/><circle cx="1071" cy="389" r="1.4" fill="#666"/><circle cx="1077" cy="389" r="1.4" fill="#666"/>
  <text class="m" x="1100" y="413" text-anchor="end">Cá nhân</text>
  <circle cx="1107" cy="409" r="3.5" fill="#299438"/>
  <line class="line" x1="382" y1="428" x2="1112" y2="428"/>

  <circle cx="362" cy="455" r="9" fill="#246fe0" fill-opacity="0.1" stroke="#246fe0" stroke-width="2"/>
  <text class="t" x="382" y="460">Ôn tập chương 3 – Kubernetes networking</text>
  <rect class="ic" x="382" y="470" width="10" height="10" rx="2" stroke="#058527"/>
  <text x="397" y="479" font-size="12" fill="#058527">Hôm nay</text>
  <text class="m" x="1100" y="479" text-anchor="end">Học tập</text>
  <circle cx="1107" cy="475" r="3.5" fill="#14aaf5"/>
  <line class="line" x1="382" y1="494" x2="1112" y2="494"/>

  <!-- ===== Inline quick add with natural-language parsing ===== -->
  <rect x="352" y="514" width="760" height="150" rx="10" fill="#ffffff" stroke="#cfcfcf"/>
  <text x="368" y="546" font-size="15" fill="#202020">Nộp báo cáo tiến độ</text>
  <rect x="510" y="530" width="66" height="22" rx="4" fill="#e6f4ea"/>
  <text x="514" y="546" font-size="15" fill="#058527">ngày mai</text>
  <rect x="580" y="530" width="24" height="22" rx="4" fill="#fdecea"/>
  <text x="584" y="546" font-size="15" fill="#c0392b">p1</text>
  <rect x="608" y="530" width="100" height="22" rx="4" fill="#ebebfa"/>
  <text x="612" y="546" font-size="15" fill="#4a4ac4">#DoAnDevOps</text>
  <rect x="711" y="539" width="1.5" height="16" fill="#202020"/>
  <text x="368" y="570" font-size="13" fill="#9a9a9a">Mô tả</text>

  <rect x="368" y="584" width="104" height="28" rx="6" fill="none" stroke="#e0e0e0"/>
  <rect class="ic" x="378" y="593" width="10" height="10" rx="2" stroke="#058527"/>
  <text x="394" y="603" font-size="12" fill="#058527">Ngày mai</text>
  <text x="459" y="603" font-size="12" fill="#9a9a9a">×</text>
  <rect x="480" y="584" width="60" height="28" rx="6" fill="none" stroke="#e0e0e0"/>
  <path d="M490 592v12M490 593h8l-2 3 2 3h-8" fill="none" stroke="#d1453b" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="503" y="603" font-size="12" fill="#c0392b">P1</text>
  <text x="527" y="603" font-size="12" fill="#9a9a9a">×</text>
  <rect x="548" y="584" width="74" height="28" rx="6" fill="none" stroke="#e0e0e0"/>
  <path class="ic" d="M558 604l7-7h6v6l-7 7z"/>
  <text x="577" y="603" font-size="12" fill="#666">Nhãn</text>

  <line x1="352" y1="624" x2="1112" y2="624" stroke="#ececec"/>
  <circle cx="374" cy="644" r="4" fill="#d1453b"/>
  <text x="384" y="648" font-size="13" fill="#444">Đồ án DevOps ▾</text>
  <rect x="948" y="632" width="60" height="26" rx="6" fill="#f1f1f1"/>
  <text x="978" y="649" font-size="13" font-weight="600" fill="#444" text-anchor="middle">Hủy</text>
  <rect x="1014" y="632" width="88" height="26" rx="6" fill="#5b5bd6"/>
  <text x="1058" y="649" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Thêm việc</text>

  <text x="352" y="690" font-size="12" fill="#8a8a8a">Gõ tự nhiên: “mai”, “thứ 6”, “20/10”, “p1”–“p4”, “#dự-án”, “@nhãn”. Nhấn × để bỏ phần đã nhận diện.</text>

  <!-- Toast with undo -->
  <rect x="540" y="742" width="360" height="44" rx="8" fill="#242424"/>
  <circle cx="562" cy="764" r="7" fill="#299438"/>
  <path d="M558.5 764l2.5 2.5 4.5-5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
  <text x="578" y="769" font-size="13" fill="#ffffff">Đã hoàn thành “Học Docker Compose”</text>
  <text x="882" y="769" font-size="13" font-weight="700" fill="#b4b4f5" text-anchor="end">Hoàn tác</text>
</svg>
