<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <title>Taskapp – mockup Lịch tuần (dạng thời khóa biểu, desktop, chế độ sáng)</title>
  <defs>
    <style>
      .side { fill: #202020; font-size: 14px; }
      .cnt { font-size: 11px; font-weight: 700; text-anchor: middle; }
      .hr { fill: #707070; font-size: 11px; text-anchor: end; }
      .grid { stroke: #ececec; stroke-width: 1; }
      .half { stroke: #f4f4f4; stroke-width: 1; stroke-dasharray: 3 3; }
      .dname { fill: #666666; font-size: 11px; font-weight: 600; text-anchor: middle; letter-spacing: 0.4px; }
      .dnum { fill: #202020; font-size: 18px; font-weight: 600; text-anchor: middle; }
      .bt { font-size: 12px; font-weight: 600; }
      .bm { font-size: 11px; }
      .ic { fill: none; stroke: #666666; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1280" height="800" fill="#ffffff"/>

  <!-- ================= Sidebar (rút gọn) ================= -->
  <rect width="240" height="800" fill="#f8f7f4"/>
  <line x1="240" y1="0" x2="240" y2="800" stroke="#ebe9e4"/>
  <rect x="20" y="24" width="24" height="24" rx="7" fill="#5b5bd6"/>
  <path d="M26 36.5l4 4 8-8.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="54" y="42" font-size="16" font-weight="700" fill="#202020">Taskapp</text>

  <text class="side" x="52" y="98">Ghi nhanh</text>
  <rect x="200" y="85" width="24" height="18" rx="9" fill="#ebebfa"/><text class="cnt" x="212" y="98" fill="#4a4ac4">2</text>
  <text class="side" x="52" y="133">Hôm nay</text>
  <rect x="200" y="120" width="24" height="18" rx="9" fill="#d1453b"/><text class="cnt" x="212" y="133" fill="#ffffff">4</text>
  <text class="side" x="52" y="168">Sắp tới</text>

  <rect x="8" y="182" width="224" height="34" rx="6" fill="#ebebfa"/>
  <rect x="24" y="191" width="16" height="15" rx="3" fill="none" stroke="#4a4ac4" stroke-width="1.6"/>
  <path d="M24 196h16M29 191v15M35 191v15" stroke="#4a4ac4" stroke-width="1.2"/>
  <text x="52" y="204" font-size="14" font-weight="600" fill="#4a4ac4">Lịch tuần</text>
  <text x="224" y="204" font-size="11" fill="#4a4ac4" text-anchor="end">mới</text>

  <text class="side" x="52" y="239">Đã hoàn thành</text>

  <text x="24" y="290" font-size="11" font-weight="700" fill="#666" letter-spacing="0.6">DỰ ÁN</text>
  <circle cx="32" cy="317" r="5" fill="#d1453b"/><text class="side" x="52" y="322">Đồ án DevOps</text>
  <rect x="200" y="309" width="24" height="18" rx="9" fill="#ebebfa"/><text class="cnt" x="212" y="322" fill="#4a4ac4">6</text>
  <circle cx="32" cy="352" r="5" fill="#299438"/><text class="side" x="52" y="357">Cá nhân</text>
  <rect x="200" y="344" width="24" height="18" rx="9" fill="#ebebfa"/><text class="cnt" x="212" y="357" fill="#4a4ac4">3</text>
  <circle cx="32" cy="387" r="5" fill="#14aaf5"/><text class="side" x="52" y="392">Học tập</text>
  <rect x="200" y="379" width="24" height="18" rx="9" fill="#ebebfa"/><text class="cnt" x="212" y="392" fill="#4a4ac4">3</text>

  <!-- ================= Header ================= -->
  <text x="276" y="56" font-size="24" font-weight="700" fill="#202020">Lịch tuần</text>
  <text x="276" y="80" font-size="13" fill="#666666">Tuần 42 · 12 – 18 tháng 10, 2026 · 11 việc</text>

  <rect x="1030" y="40" width="86" height="30" rx="6" fill="none" stroke="#e5e5e5"/>
  <text x="1073" y="60" font-size="13" font-weight="600" fill="#444" text-anchor="middle">Tuần này</text>
  <rect x="1124" y="40" width="30" height="30" rx="6" fill="none" stroke="#e5e5e5"/>
  <path class="ic" d="M1142 49l-6 6 6 6"/>
  <rect x="1160" y="40" width="30" height="30" rx="6" fill="none" stroke="#e5e5e5"/>
  <path class="ic" d="M1172 49l6 6-6 6"/>
  <rect x="1198" y="40" width="58" height="30" rx="6" fill="none" stroke="#e5e5e5"/>
  <text x="1227" y="60" font-size="13" fill="#444" text-anchor="middle">7 ngày</text>

  <!-- ================= Grid ================= -->
  <!-- today column highlight (Fri) -->
  <rect x="864" y="100" width="131" height="680" fill="#f7f7fd"/>

  <!-- day headers -->
  <g>
    <text class="dname" x="405" y="118">T2</text><text class="dnum" x="405" y="142">12</text>
    <text class="dname" x="536" y="118">T3</text><text class="dnum" x="536" y="142">13</text>
    <text class="dname" x="667" y="118">T4</text><text class="dnum" x="667" y="142">14</text>
    <text class="dname" x="798" y="118">T5</text><text class="dnum" x="798" y="142">15</text>
    <text class="dname" x="929" y="118" fill="#4a4ac4">T6 · HÔM NAY</text>
    <circle cx="929" cy="136" r="15" fill="#5b5bd6"/><text x="929" y="142" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">16</text>
    <text class="dname" x="1060" y="118">T7</text><text class="dnum" x="1060" y="142">17</text>
    <text class="dname" x="1191" y="118">CN</text><text class="dnum" x="1191" y="142">18</text>
  </g>

  <!-- all-day row -->
  <text class="hr" x="332" y="176">Cả ngày</text>
  <line class="grid" x1="340" y1="158" x2="1257" y2="158"/>
  <rect x="344" y="164" width="123" height="22" rx="5" fill="#fff4e5" stroke="#d97706" stroke-width="0" />
  <rect x="344" y="164" width="3" height="22" rx="1.5" fill="#d97706"/>
  <text x="352" y="179" font-size="11" fill="#202020">Gọi điện cho thầy</text>
  <rect x="606" y="164" width="123" height="22" rx="5" fill="#e8f6fe"/>
  <rect x="606" y="164" width="3" height="22" rx="1.5" fill="#14aaf5"/>
  <text x="614" y="179" font-size="11" fill="#202020">Đọc tài liệu Prometheus</text>
  <rect x="868" y="164" width="123" height="22" rx="5" fill="#eaf6ec"/>
  <rect x="868" y="164" width="3" height="22" rx="1.5" fill="#299438"/>
  <text x="876" y="179" font-size="11" fill="#202020">Mua sữa và trứng</text>
  <line x1="340" y1="194" x2="1257" y2="194" stroke="#dcdcdc"/>

  <!-- hour lines 07:00 .. 19:00 (44px/hour) -->
  <g>
    <text class="hr" x="332" y="219">07:00</text><line class="grid" x1="340" y1="215" x2="1257" y2="215"/>
    <text class="hr" x="332" y="263">08:00</text><line class="grid" x1="340" y1="259" x2="1257" y2="259"/>
    <text class="hr" x="332" y="307">09:00</text><line class="grid" x1="340" y1="303" x2="1257" y2="303"/>
    <text class="hr" x="332" y="351">10:00</text><line class="grid" x1="340" y1="347" x2="1257" y2="347"/>
    <text class="hr" x="332" y="395">11:00</text><line class="grid" x1="340" y1="391" x2="1257" y2="391"/>
    <text class="hr" x="332" y="439">12:00</text><line class="grid" x1="340" y1="435" x2="1257" y2="435"/>
    <text class="hr" x="332" y="483">13:00</text><line class="grid" x1="340" y1="479" x2="1257" y2="479"/>
    <text class="hr" x="332" y="527">14:00</text><line class="grid" x1="340" y1="523" x2="1257" y2="523"/>
    <text class="hr" x="332" y="571">15:00</text><line class="grid" x1="340" y1="567" x2="1257" y2="567"/>
    <text class="hr" x="332" y="615">16:00</text><line class="grid" x1="340" y1="611" x2="1257" y2="611"/>
    <text class="hr" x="332" y="659">17:00</text><line class="grid" x1="340" y1="655" x2="1257" y2="655"/>
    <text class="hr" x="332" y="703">18:00</text><line class="grid" x1="340" y1="699" x2="1257" y2="699"/>
    <text class="hr" x="332" y="747">19:00</text><line class="grid" x1="340" y1="743" x2="1257" y2="743"/>
  </g>
  <!-- day separators -->
  <g class="grid">
    <line x1="340" y1="100" x2="340" y2="780"/><line x1="471" y1="100" x2="471" y2="780"/>
    <line x1="602" y1="100" x2="602" y2="780"/><line x1="733" y1="100" x2="733" y2="780"/>
    <line x1="864" y1="100" x2="864" y2="780"/><line x1="995" y1="100" x2="995" y2="780"/>
    <line x1="1126" y1="100" x2="1126" y2="780"/><line x1="1257" y1="100" x2="1257" y2="780"/>
  </g>

  <!-- ============ Task blocks (colour = project, ring = priority) ============ -->
  <!-- Mon 08:00–10:00 Học tập -->
  <rect x="344" y="261" width="123" height="84" rx="6" fill="#e8f6fe"/>
  <rect x="344" y="261" width="3" height="84" rx="1.5" fill="#14aaf5"/>
  <circle cx="358" cy="275" r="5.5" fill="none" stroke="#246fe0" stroke-width="1.6"/>
  <text class="bt" x="368" y="279" fill="#202020">Học K8s</text>
  <text class="bt" x="352" y="295" fill="#202020">networking</text>
  <text class="bm" x="352" y="312" fill="#555">08:00 – 10:00</text>
  <text class="bm" x="352" y="328" fill="#555">Học tập</text>

  <!-- Tue 13:00–14:30 Đồ án -->
  <rect x="475" y="481" width="123" height="64" rx="6" fill="#fbecea"/>
  <rect x="475" y="481" width="3" height="64" rx="1.5" fill="#d1453b"/>
  <circle cx="489" cy="495" r="5.5" fill="none" stroke="#d97706" stroke-width="1.6"/>
  <text class="bt" x="499" y="499" fill="#202020">Họp nhóm đồ án</text>
  <text class="bm" x="483" y="516" fill="#555">13:00 – 14:30</text>
  <text class="bm" x="483" y="532" fill="#555">@khẩn</text>

  <!-- Wed 09:00–10:00 done -->
  <rect x="606" y="305" width="123" height="40" rx="6" fill="#f3f3f3"/>
  <circle cx="620" cy="319" r="5.5" fill="#8a8a8a"/>
  <path d="M617.5 319l2 2 3-3.5" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>
  <text class="bt" x="630" y="323" fill="#707070" text-decoration="line-through">Sửa probe</text>
  <text class="bm" x="614" y="338" fill="#707070">09:00 – 10:00</text>

  <!-- Thu 07:30–08:30 Cá nhân -->
  <rect x="737" y="237" width="123" height="40" rx="6" fill="#eaf6ec"/>
  <rect x="737" y="237" width="3" height="40" rx="1.5" fill="#299438"/>
  <circle cx="751" cy="251" r="5.5" fill="none" stroke="#8a8a8a" stroke-width="1.4"/>
  <text class="bt" x="761" y="255" fill="#202020">Đá bóng</text>
  <text class="bm" x="745" y="270" fill="#555">07:30 – 08:30</text>

  <!-- Thu: hover empty slot -->
  <rect x="737" y="349" width="123" height="40" rx="6" fill="none" stroke="#5b5bd6" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="798" y="373" font-size="12" font-weight="600" fill="#4a4ac4" text-anchor="middle">+ Thêm lúc 10:00</text>

  <!-- Fri (today) 09:00–11:00 + 14:00–15:00 -->
  <rect x="868" y="305" width="123" height="84" rx="6" fill="#fbecea" stroke="#5b5bd6" stroke-width="1.5"/>
  <rect x="868" y="305" width="3" height="84" rx="1.5" fill="#d1453b"/>
  <circle cx="882" cy="319" r="5.5" fill="none" stroke="#d97706" stroke-width="1.6"/>
  <text class="bt" x="892" y="323" fill="#202020">Viết Helm chart</text>
  <text class="bt" x="876" y="339" fill="#202020">cho backend</text>
  <text class="bm" x="876" y="356" fill="#555">09:00 – 11:00 · 1/3</text>
  <text class="bm" x="876" y="372" fill="#555">Đồ án DevOps</text>

  <rect x="868" y="525" width="123" height="40" rx="6" fill="#e8f6fe"/>
  <rect x="868" y="525" width="3" height="40" rx="1.5" fill="#14aaf5"/>
  <circle cx="882" cy="539" r="5.5" fill="none" stroke="#246fe0" stroke-width="1.6"/>
  <text class="bt" x="892" y="543" fill="#202020">Ôn tập chương 3</text>
  <text class="bm" x="876" y="558" fill="#555">14:00 – 15:00</text>

  <!-- now indicator 10:20 -->
  <circle cx="864" cy="362" r="4" fill="#d1453b"/>
  <line x1="864" y1="362" x2="995" y2="362" stroke="#d1453b" stroke-width="2"/>

  <!-- Sat 08:00–09:00 P1 -->
  <rect x="999" y="261" width="123" height="40" rx="6" fill="#fbecea"/>
  <rect x="999" y="261" width="3" height="40" rx="1.5" fill="#d1453b"/>
  <circle cx="1013" cy="275" r="5.5" fill="#d1453b" fill-opacity="0.12" stroke="#d1453b" stroke-width="1.8"/>
  <text class="bt" x="1023" y="279" fill="#202020">Nộp báo cáo</text>
  <text class="bm" x="1007" y="294" fill="#555">08:00 – 09:00</text>

  <!-- Sun 16:00–17:00 -->
  <rect x="1130" y="613" width="123" height="40" rx="6" fill="#eaf6ec"/>
  <rect x="1130" y="613" width="3" height="40" rx="1.5" fill="#299438"/>
  <circle cx="1144" cy="627" r="5.5" fill="none" stroke="#8a8a8a" stroke-width="1.4"/>
  <text class="bt" x="1154" y="631" fill="#202020">Dọn phòng</text>
  <text class="bm" x="1138" y="646" fill="#555">16:00 – 17:00</text>

  <!-- legend -->
  <text x="276" y="796" font-size="11" fill="#666">Màu nền = dự án · Vòng tròn = mức ưu tiên · Đường đỏ = giờ hiện tại · Bấm ô trống để thêm việc vào đúng ngày giờ</text>
</svg>
