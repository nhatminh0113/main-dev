# Ansible reads this file only when the current directory is not world-writable,
# so run Ansible from a copy inside the WSL filesystem (scripts/ansible-wsl.sh),
# never from /mnt/d/...
[defaults]
# Variables live in inventory/group_vars/: ansible-playbook reads group_vars next to
# the inventory file or the playbook, not next to this file.
inventory = inventory/hosts.yml
roles_path = roles
# Default login user. The first run bootstraps with `-u nhat -K` (the -u flag
# overrides remote_user, while an ansible_user variable would override -u).
remote_user = deploy
interpreter_python = /usr/bin/python3
host_key_checking = True
retry_files_enabled = False

[ssh_connection]
pipelining = True
