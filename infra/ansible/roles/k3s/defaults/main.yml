---
# Pinned k3s release (https://github.com/k3s-io/k3s/releases/tag/v1.36.6%2Bk3s1).
k3s_version: v1.36.6+k3s1
# install.sh taken from the same tag, never from https://get.k3s.io (that one follows
# the main branch). Recompute the checksum whenever k3s_version changes:
#   curl -fsSL "https://raw.githubusercontent.com/k3s-io/k3s/<tag with + as %2B>/install.sh" | sha256sum
k3s_install_script_url: "https://raw.githubusercontent.com/k3s-io/k3s/{{ k3s_version | urlencode }}/install.sh"
k3s_install_script_sha256: 46177d4c99440b4c0311b67233823a8e8a2fc09693f6c89af1a7161e152fbfad
k3s_install_script_dir: /usr/local/share/k3s-install

# Address the node registers with: the static Host-only IP (network role). The
# Bridged IP changes when the laptop joins another network, which would break the node.
k3s_node_ip: "{{ network_hostonly_ip }}"
k3s_flannel_iface: "{{ network_hostonly_interface }}"

# k3s defaults, written to config.yaml so the firewall rules below stay in sync.
# Changing them after the first install is not supported by k3s.
k3s_cluster_cidr: 10.42.0.0/16
k3s_service_cidr: 10.43.0.0/16

# How long to wait for the node to report Ready (retries x delay seconds).
k3s_ready_retries: 30
k3s_ready_delay: 10

# Kubeconfig copied to the control node (WSL), outside the repository.
k3s_kubeconfig_local_path: "{{ lookup('ansible.builtin.env', 'HOME') }}/.kube/config-vps"
# The API is reached through scripts/tunnel.sh (port 6443 stays closed in UFW).
k3s_kubeconfig_server: https://127.0.0.1:6443
