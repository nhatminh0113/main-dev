---
- name: Reload ufw
  community.general.ufw:
    state: reloaded

- name: Restart fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    state: restarted

# Ubuntu 24.04 starts sshd through ssh.socket, but the daemon is ssh.service. Reloading
# ssh.service applies authentication options; only Port/ListenAddress changes would
# need `systemctl daemon-reload` + a restart of ssh.socket, and this role sets neither.
# Open sessions stay connected.
- name: Reload ssh
  ansible.builtin.systemd_service:
    name: ssh.service
    state: reloaded
