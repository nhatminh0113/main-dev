# Temporary Task 8 check: plain HTTP Ingress through the bundled Traefik.
# Delete after Task 9 (HTTPS check done).
#
#   sed "s/BASE_DOMAIN/${BASE_DOMAIN}/g" infra/k8s-test/whoami.yaml | kubectl apply -f -
#   curl http://test.${BASE_DOMAIN}/
#   kubectl delete namespace whoami-test
---
apiVersion: v1
kind: Namespace
metadata:
  name: whoami-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: whoami-test
  labels:
    app.kubernetes.io/name: whoami
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: whoami
  template:
    metadata:
      labels:
        app.kubernetes.io/name: whoami
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: whoami
          image: traefik/whoami:v1.12.0
          args: ["--port", "8080"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: whoami-test
spec:
  selector:
    app.kubernetes.io/name: whoami
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whoami
  namespace: whoami-test
spec:
  ingressClassName: traefik
  rules:
    - host: test.BASE_DOMAIN
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: whoami
                port:
                  name: http
