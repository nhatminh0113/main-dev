{{- /*
Internal CA (no public IP, no real domain, so no Let's Encrypt):
  ClusterIssuer selfsigned -> Certificate <rootCA.name> (isCA) -> ClusterIssuer internal-ca.
The CA private key is generated by cert-manager and stays in Secret
cert-manager/<rootCA.name>. Only tls.crt (the public certificate) is ever exported.
ClusterIssuer CA secrets must live in the cluster resource namespace (cert-manager).
*/ -}}
{{- $selfSigned := required "selfSignedIssuer is required" .Values.selfSignedIssuer -}}
{{- $caIssuer := required "caIssuer is required" .Values.caIssuer -}}
{{- $ca := .Values.rootCA -}}
{{- $caName := required "rootCA.name is required" $ca.name -}}
{{- if not $ca.permittedDNSDomains }}
{{- fail "rootCA.permittedDNSDomains must list at least one domain (name constraints)" }}
{{- end }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $selfSigned }}
  labels:
    {{- include "cluster-issuers.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $caName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster-issuers.labels" . | nindent 4 }}
spec:
  isCA: true
  commonName: {{ required "rootCA.commonName is required" $ca.commonName | quote }}
  subject:
    organizations:
      - {{ required "rootCA.organization is required" $ca.organization | quote }}
  secretName: {{ $caName }}
  duration: {{ required "rootCA.duration is required" $ca.duration }}
  renewBefore: {{ required "rootCA.renewBefore is required" $ca.renewBefore }}
  privateKey:
    algorithm: ECDSA
    size: 256
  nameConstraints:
    critical: true
    permitted:
      dnsDomains:
        {{- toYaml $ca.permittedDNSDomains | nindent 8 }}
  issuerRef:
    name: {{ $selfSigned }}
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $caIssuer }}
  labels:
    {{- include "cluster-issuers.labels" . | nindent 4 }}
spec:
  ca:
    secretName: {{ $caName }}
