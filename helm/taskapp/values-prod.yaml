# Production (namespace "prod", deployed from main after manual approval).
# helm upgrade --install taskapp ./helm/taskapp -n prod -f helm/taskapp/values-prod.yaml \
#   --set image.tag=sha-xxxxxxx --set ingress.host=app.<base_domain>

backend:
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 384Mi }

frontend:
  replicas: 2
  resources:
    requests: { cpu: 20m, memory: 24Mi }
    limits: { cpu: 300m, memory: 96Mi }

postgres:
  storage:
    size: 2Gi
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { cpu: "1", memory: 768Mi }

ingress:
  tls:
    clusterIssuer: letsencrypt-prod

basicAuth:
  enabled: true
