{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy -}}
{{- $labels := include "taskapp.labels" (dict "ctx" . "component" "network") -}}
{{- $sel := dict "ctx" . -}}
# 1. Default deny: no ingress to any pod in this namespace unless allowed below.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "taskapp.fullname" . }}-default-deny-ingress
  labels:
    {{- $labels | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# 2. Ingress controller (Traefik) -> frontend:8080 and backend:8000
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "taskapp.fullname" . }}-allow-ingress-controller
  labels:
    {{- $labels | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/instance
        operator: In
        values: [{{ .Release.Name | quote }}]
      - key: app.kubernetes.io/component
        operator: In
        values: [frontend, backend]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.ingressControllerNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 8000 }
---
# 3. Only the backend may reach PostgreSQL
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "taskapp.fullname" . }}-allow-backend-to-postgres
  labels:
    {{- $labels | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "taskapp.selectorLabels" (merge (dict "component" "postgres") $sel) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "taskapp.selectorLabels" (merge (dict "component" "backend") $sel) | nindent 14 }}
      ports:
        - { protocol: TCP, port: 5432 }
---
# 4. Prometheus scrapes backend /metrics
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "taskapp.fullname" . }}-allow-monitoring
  labels:
    {{- $labels | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "taskapp.selectorLabels" (merge (dict "component" "backend") $sel) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.monitoringNamespace }}
      ports:
        - { protocol: TCP, port: 8000 }
---
# 5. cert-manager HTTP-01 solver pods (created in this namespace while a certificate is
#    issued or renewed) must be reachable from Traefik, otherwise renewals fail.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "taskapp.fullname" . }}-allow-acme-solver
  labels:
    {{- $labels | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.ingressControllerNamespace }}
      ports:
        - { protocol: TCP, port: 8089 }
{{- end }}
