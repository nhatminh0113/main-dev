{{- if .Values.ingress.enabled }}
{{- $fullname := include "taskapp.fullname" . -}}
{{- $host := required "ingress.host is required (e.g. --set ingress.host=staging.<IP>.sslip.io)" .Values.ingress.host -}}
{{- $tls := .Values.ingress.tls -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "taskapp.labels" (dict "ctx" . "component" "ingress") | nindent 4 }}
  annotations:
    {{- if and $tls.enabled $tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ $tls.clusterIssuer | quote }}
    {{- end }}
    {{- if .Values.basicAuth.enabled }}
    # Traefik CRD middleware reference: <namespace>-<name>@kubernetescrd
    traefik.ingress.kubernetes.io/router.middlewares: "{{ .Release.Namespace }}-{{ $fullname }}-basic-auth@kubernetescrd"
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if $tls.enabled }}
  tls:
    - hosts: [{{ $host | quote }}]
      secretName: {{ $fullname }}-tls
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          # /api -> FastAPI. /metrics is deliberately not exposed (scraped in-cluster).
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-backend
                port: { name: http }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-frontend
                port: { name: http }
{{- end }}
