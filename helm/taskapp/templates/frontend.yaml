{{- $fullname := include "taskapp.fullname" . -}}
{{- $ctx := dict "ctx" . "component" "frontend" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-frontend
  labels:
    {{- include "taskapp.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "taskapp.selectorLabels" $ctx | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "taskapp.labels" $ctx | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- include "taskapp.podSecurityContext" (dict "uid" 101) | nindent 8 }}
      containers:
        - name: frontend
          image: {{ include "taskapp.image" $ctx }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            # nginx resolves its /api upstream at start-up, so it must exist. On Kubernetes the
            # Ingress routes /api to the backend before requests reach nginx.
            - name: API_UPSTREAM
              value: "http://{{ $fullname }}-backend:8000"
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext:
            {{- include "taskapp.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            # Writable paths for a read-only root filesystem: pid/temp files and the
            # config rendered from the template by the image entrypoint.
            - name: tmp
              mountPath: /tmp
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
        - name: nginx-conf
          emptyDir:
            sizeLimit: 1Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-frontend
  labels:
    {{- include "taskapp.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "taskapp.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
