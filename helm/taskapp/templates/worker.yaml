{{- if .Values.worker.enabled }}
{{- $fullname := include "taskapp.fullname" . -}}
{{- $ctx := dict "ctx" . "component" "worker" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-worker
  labels:
    {{- include "taskapp.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "taskapp.selectorLabels" $ctx | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "taskapp.labels" $ctx | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # SIGTERM lets the current job finish; after this the job is reclaimed (at-least-once).
      terminationGracePeriodSeconds: 60
      securityContext:
        {{- include "taskapp.podSecurityContext" (dict "uid" 10001) | nindent 8 }}
      containers:
        - name: worker
          # Same image as the backend. `command` replaces the entrypoint, so the worker never
          # runs migrations (the backend is the only place that does).
          image: {{ include "taskapp.image" (dict "ctx" . "component" "backend") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "app.worker"]
          ports:
            - name: metrics
              containerPort: 9000
          env:
            {{- include "taskapp.databaseEnv" . | nindent 12 }}
            {{- include "taskapp.loggingEnv" . | nindent 12 }}
            - name: WORKER_POLL_INTERVAL
              value: {{ .Values.worker.pollInterval | quote }}
          # Liveness only checks the loop heartbeat (it keeps ticking while waiting for the
          # schema), so no startupProbe is needed.
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: metrics }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            {{- include "taskapp.containerSecurityContext" . | nindent 12 }}
          # No volumes: the worker writes nothing to disk (results are stored in PostgreSQL).
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-worker
  labels:
    {{- include "taskapp.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "taskapp.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: metrics
      port: 9000
      targetPort: metrics
{{- end }}
